name: Build Kristen Hancher photo pack

on:
  push:
    branches:
      - asset-photo-test
    paths:
      - ".github/workflows/build-player-photos.yml"
      - "scripts/build_kristen_hancher.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Publish run marker
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .kristen_hancher_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .kristen_hancher_run_id.txt
          git commit -m "chore: record Kristen Hancher photo workflow run" || true
          git push origin HEAD:asset-photo-test || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4

      - name: Build Kristen Hancher photo pack
        run: python scripts/build_kristen_hancher.py

      - name: Upload completed pack
        uses: actions/upload-artifact@v4
        with:
          name: kristen-hancher-photo-pack
          path: kristen_hancher_photo_pack_png_max130kb.zip
          if-no-files-found: error
          retention-days: 7
