name: Build curated player photo pack

on:
  push:
    branches:
      - asset-photo-test
    paths:
      - ".github/workflows/build-player-photos.yml"
      - "scripts/build_player_photos_batch03.py"
      - "scripts/patch_player_photos_batch03.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4 opencv-python-headless==4.12.0.88

      - name: Download real photos, crop faces, validate, and package
        run: python scripts/build_player_photos_batch03.py

      - name: Apply curated historical corrections
        run: python scripts/patch_player_photos_batch03.py

      - name: Upload completed pack
        uses: actions/upload-artifact@v4
        with:
          name: football-player-photos-batch03
          path: football_player_photos_batch03_png_max130kb.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish run marker
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .batch03_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .batch03_run_id.txt
          git commit -m "chore: record batch 03 workflow run" || exit 0
          git push origin HEAD:asset-photo-test
