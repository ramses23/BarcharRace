name: Build curated player photo pack

on:
  push:
    branches:
      - asset-photo-test
    paths:
      - ".github/workflows/build-player-photos.yml"
      - "scripts/build_player_photos_batch02.py"
      - "scripts/patch_player_photos_batch02.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4 opencv-python-headless==4.12.0.88

      - name: Download real photos, crop faces, validate, and package
        continue-on-error: true
        run: python scripts/build_player_photos_batch02.py

      - name: Add curated historical fallback and validate complete set
        run: python scripts/patch_player_photos_batch02.py

      - name: Upload completed pack
        uses: actions/upload-artifact@v4
        with:
          name: football-player-photos-batch02
          path: football_player_photos_batch02_png_max130kb.zip
          if-no-files-found: error
          retention-days: 7
