name: Build anime primary retry3 assets

on:
  push:
    branches:
      - asset-photo-test
    paths:
      - ".github/workflows/build-anime-primary-retry3.yml"
      - "scripts/build_anime_primary_retry_chunked.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-retry3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4 rembg==2.0.67 onnxruntime==1.22.1

      - name: Build unresolved character assets in safe chunks
        run: |
          python scripts/build_anime_primary_retry_chunked.py > anime_retry3.log 2>&1 || true
          cat anime_retry3.log

      - name: Upload retry3 diagnostics and pack
        uses: actions/upload-artifact@v4
        with:
          name: anime-primary-retry3-pack
          path: |
            anime_retry3.log
            anime_primary_retry3_assets_png_max130kb.zip
            anime_primary_retry3_preview.jpg
          if-no-files-found: warn
          retention-days: 7
