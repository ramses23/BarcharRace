name: Build anime Levi Ackerman asset

on:
  push:
    branches:
      - asset-photo-test
    paths:
      - ".github/workflows/build-anime-levi-only.yml"
      - "scripts/build_anime_levi_only.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-levi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 requests==2.32.4 rembg==2.0.67 onnxruntime==1.22.1

      - name: Build Levi Ackerman asset
        run: python scripts/build_anime_levi_only.py

      - name: Upload Levi asset pack
        uses: actions/upload-artifact@v4
        with:
          name: anime-levi-only-pack
          path: |
            anime_levi_only_png_max130kb.zip
            anime_levi_only_preview.jpg
          if-no-files-found: error
          retention-days: 7
